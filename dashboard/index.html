<style>
@font-face{font-family:Cairo;src:url(/fonts/Cairo.ttf) format("truetype");font-weight:200 1000;font-display:block}
:root{--bg:#F9FAFB;--card:#fff;--ink:#1F2228;--mute:#8A9099;--line:#EEF0F3;--g1:#FF8A4C;--g2:#F2385A;--grad:linear-gradient(135deg,#FF9A4D 0%,#FF5E3A 50%,#F2385A 100%);--green:#10B981;--red:#EF4444;--r:22px;--sh:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,sans-serif;-webkit-font-smoothing:antialiased}

header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:16px;padding:14px 28px;background:rgba(249,250,251,.8);backdrop-filter:blur(14px)}

.pill{position:absolute;top:5px;bottom:5px;border-radius:999px;background:var(--ink);z-index:0}
.navin button{position:relative;z-index:1;border:0;background:none;font:600 14px Cairo;color:var(--mute);padding:8px 18px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:color .25s}
.navin button.on{color:#fff}
.tools{display:flex;gap:10px;align-items:center}
.ic{width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:var(--sh);display:grid;place-items:center;position:relative}
.ic .dot{position:absolute;top:9px;left:10px;width:8px;height:8px;border-radius:50%;background:var(--g2);border:2px solid #fff}

.view{display:none}.view.show{display:block}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px;grid-auto-flow:dense}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:22px;transition:transform .3s cubic-bezier(.3,1.4,.5,1),box-shadow .3s;min-width:0}
.card:hover,.card.lift{transform:translateY(-5px);box-shadow:0 2px 4px rgba(16,24,40,.04),0 18px 40px rgba(16,24,40,.12)}

.chip{font-size:12px;padding:3px 10px;border-radius:999px;background:#F3F4F6;color:#6B7280;font-weight:700;white-space:nowrap;display:inline-block}
.g{background:#E7F8F1;color:#0E9F6E}.rd{background:#FDECEC;color:#DC3B3B}.y{background:#FEF5DC;color:#B7791F}.gr{background:#F1F2F4;color:#7A808A}.dk{background:var(--ink);color:#fff}
.gradcard{background:var(--grad);color:#fff}.gradcard .ttl{color:rgba(255,255,255,.85)}
.cta{display:flex;flex-direction:column;justify-content:space-between;min-height:190px;position:relative;overflow:hidden}

.gauge{display:flex;flex-direction:column;align-items:center;text-align:center}

.stat .row{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-top:6px}
.spark{width:110px;height:42px}
.map{display:grid;grid-template-columns:repeat(9,1fr);gap:8px;margin-top:12px}
.map div{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:9px;font-weight:700;color:#fff;direction:ltr;overflow:hidden}
.map div img{width:72%;height:72%;border-radius:50%;background:#fff;box-shadow:0 0 0 2px #fff}
.coin{width:22px;height:22px;border-radius:50%;vertical-align:middle;margin-inline-end:6px;display:inline-grid;place-items:center;font-size:9px;font-weight:800;color:#fff;background:var(--grad);overflow:hidden}

.legend{display:flex;gap:12px;font-size:12px;color:var(--mute);margin-top:12px}

.bars .b i.neg{background:#E5E7EB}
.bars small{font-size:11px;color:var(--mute)}
.wide{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:18px}
.list{display:flex;flex-direction:column;gap:2px;max-height:250px;overflow:hidden}
.li{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:flex-start}
.li:last-child{border:0}.li .t{color:var(--mute);min-width:62px;font-weight:600}
.li .x{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dark{background:var(--ink);color:#fff;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px}
.dark .kv{display:flex;justify-content:space-between;font-size:14px;color:#B9BEC7}.dark .kv b{color:#fff}
.wbtn{align-self:flex-start;background:#fff;color:var(--ink);border:0;border-radius:999px;padding:11px 24px;font:700 14px Cairo;cursor:pointer;margin-top:auto}
.live{display:inline-flex;align-items:center;gap:6px}.live:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(16,185,129,.2)}
h1{font-size:38px;font-weight:800;margin:14px 0 4px;letter-spacing:-.5px}.sub{color:var(--mute);margin:0 0 22px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:18px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{color:var(--mute);font-weight:600;text-align:right;padding:12px 10px;font-size:13px;white-space:nowrap}
td{padding:14px 10px;border-top:1px solid var(--line);vertical-align:middle}
td.sym{font-weight:700;direction:ltr;text-align:right}
.tblwrap{overflow-x:auto}
.more{display:block;margin:18px auto 0;background:#fff;border:1px solid #E5E7EB;border-radius:999px;padding:10px 28px;font:700 14px Cairo;cursor:pointer;color:var(--ink)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.fp{border:0;background:#F3F4F6;color:#555;border-radius:999px;padding:8px 16px;font:700 13px Cairo;cursor:pointer}
.fp.on{background:var(--ink);color:#fff}
.search{margin-inline-start:auto;border:1px solid #E5E7EB;border-radius:999px;padding:9px 16px;font:500 14px Cairo;min-width:220px;background:#fff;outline:none}
.reason{color:var(--mute);font-size:12.5px;max-width:330px}
.form{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.fld label{display:block;font-size:13px;color:var(--mute);font-weight:600;margin-bottom:6px}
.fld input{width:100%;border:1px solid #E5E7EB;border-radius:14px;padding:12px 14px;font:600 15px Cairo;background:#FBFBFC;outline:none}
.fld input:focus{border-color:var(--g1);box-shadow:0 0 0 4px rgba(255,138,76,.15)}
.gbtn{background:var(--grad);color:#fff;border:0;border-radius:999px;padding:12px 28px;font:700 14px Cairo;cursor:pointer;box-shadow:0 8px 20px rgba(242,56,90,.25)}
.kvs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kvs div{background:#F7F8FA;border-radius:14px;padding:12px}.kvs small{display:block;color:var(--mute);font-size:12px}.kvs b{font-size:15px}
.hl{padding:14px 0;border-top:1px solid var(--line);display:flex;gap:12px;align-items:center}.hl:first-child{border:0}
.cursor{position:fixed;z-index:99;width:22px;height:22px;pointer-events:none;display:none;left:0;top:0}
@media(max-width:900px){.c3,.c4,.c5,.c6,.c7,.c8{grid-column:span 6}.wide{grid-template-columns:1fr}.form,.kvs{grid-template-columns:1fr 1fr}}
@media(max-width:640px){header{flex-wrap:wrap;padding:12px 16px}nav{order:3;flex-basis:100%;justify-content:flex-start}.navin{max-width:100%}main{padding:8px 16px 30px}.grid{grid-template-columns:1fr}.grid>*{grid-column:1/-1!important;grid-row:auto!important}.sum{grid-template-columns:1fr}.form,.kvs{grid-template-columns:1fr}h1{font-size:30px}.search{min-width:0;width:100%}.big{font-size:26px}.logo{flex:1}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
/* ===== data layer: live endpoints (same-origin, Basic auth session) ===== */
function errText(j,r){const d=j&&j.detail;if(typeof d==='string')return d;if(d&&d.message)return d.message+(d.reason?' — '+d.reason:'');if(Array.isArray(d))return 'بيانات غير صالحة';return 'HTTP '+r.status;}
function getJSON(url){return fetch(url,{cache:'no-store',credentials:'same-origin',headers:{Accept:'application/json'}}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();});}
const API={
 state:()=>getJSON('/api/state?_='+Date.now()),
 equity:(range='1d')=>getJSON('/api/equity?range='+encodeURIComponent(range)+'&_='+Date.now()),
 post:(url,body)=>fetch(url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(body)}).then(r=>r.json().catch(()=>({})).then(j=>{if(!r.ok)throw new Error(errText(j,r));return j;})),
 scanNow:()=>fetch('/check',{cache:'no-store',credentials:'same-origin'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);toast('بدأ فحص السوق في الخلفية');setTimeout(refresh,2500);}).catch(()=>toast('تعذّر بدء الفحص'))
};
function act(p,ok){return p.then(j=>{toast(ok);refresh();return j;}).catch(e=>{toast('خطأ: '+e.message);});}
function refresh(){return API.state().then(d=>{S=d;renderAll();}).catch(()=>{});}
/* ===== motion: spring easing via linear(), every animation registered so frames can be seeked ===== */
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
function springEase(st=170,dm=18,n=60){let x=0,v=0,pts=[],dt=1/n*1.1;for(let i=0;i<=n;i++){pts.push(+(x).toFixed(4));const f=-st*(x-1)-dm*v;v+=f*dt/ (1);x+=v*dt;}pts[n]=1;return 'linear('+pts.join(',')+')';}
const SPRING=springEase(),SPRING2=springEase(260,22);
let NOW=0;const ANIMS=[];
function A(el,kf,o){if(RM)return null;const a=el.animate(kf,Object.assign({fill:'both'},o));ANIMS.push({a,s:NOW});return a;}
/* ===== helpers ===== */
const $=s=>document.querySelector(s);
const f2=(n,d=2)=>n==null||isNaN(n)?'—':Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const sg=n=>(n>=0?'+':'')+f2(n);
const N=h=>`<span class="num">${h}</span>`;
const tm=iso=>{if(!iso)return'—';const d=new Date(iso);return d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Riyadh'})};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=document.createElement('div');t.textContent=m;t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1F2228;color:#fff;padding:12px 22px;border-radius:999px;font:600 14px Cairo;z-index:100';document.body.appendChild(t);setTimeout(()=>t.remove(),2200);}
function spark(vals,color='#10B981'){if(!vals||vals.length<2)vals=[0,0];const mn=Math.min(...vals),mx=Math.max(...vals),r=mx-mn||1,w=110,h=42;
 const p=vals.map((v,i)=>[i/(vals.length-1)*w,h-4-(v-mn)/r*(h-8)]);const d='M'+p.map(q=>q.map(z=>z.toFixed(1)).join(',')).join('L');const id='s'+Math.random().toString(36).slice(2,7);
 return `<svg class="spark" viewBox="0 0 ${w} ${h}"><defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".25"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path d="${d}L${w},${h}L0,${h}Z" fill="url(#${id})"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linecap="round"/></svg>`;}
function outcomeCls(o,st){const s=(o||'')+' '+(st||'');if(/نُفّذ|نفذ|منفّذ|منفذ|تم التنفيذ|filled|executed|مُرسل/i.test(s)&&!/لم يُرسل/.test(s))return'g';if(/مرفوض|رفض|reject|فشل/i.test(s))return'rd';if(/تجميد|مجمد|تسوية|reconcile|frozen|معلّق/i.test(s))return'y';return'gr';}
function sigPill(s){return s==='long'?'<span class="chip g">Long ▲</span>':s==='short'?'<span class="chip rd">Short ▼</span>':'<span class="chip gr">لا إشارة</span>';}
const isFut=s=>/:USDT/.test(s||'');
const ICONS=new Set('ADA AVAX BCH BNB BTC DOGE DOT ETH LINK LTC META NEAR NVDA SOL SPCX SPCXB TRX TSLA USDT XAU XRP'.split(' '));
const baseSym=s=>String(s||'').split('/')[0].toUpperCase();
const icoImg=s=>{const b=baseSym(s);return ICONS.has(b)?`<img src="/icons/${b}.svg" alt="${esc(b)}" loading="lazy">`:''};
const coin=s=>{const b=baseSym(s),i=icoImg(s);return `<span class="coin">${i||esc(b.slice(0,3))}</span>`};const sym=s=>(s||'').replace(':USDT','');
/* ===== render ===== */
let S,EQ;
function homeHTML(){
 const w=S.wallet||{},fu=S.futures||{},st=S.stats||{};{const _d=S.daily_risk||{};const mk=(o,eq)=>Object.assign({baseline:eq||0,equity:eq||0,loss_pct:0,limit_pct:0},o||{});S.daily_risk={spot:mk(_d.spot,w.total),futures:mk(_d.futures,fu.balance)};if(!S.daily_risk.spot.baseline)S.daily_risk.spot.baseline=S.daily_risk.spot.equity||1;}const dr=S.daily_risk;const total=(w.total||0)+(fu.balance||0);const base=(dr.spot.baseline||0)+(dr.futures.baseline||0);
 const dPct=base?(dr.spot.equity+dr.futures.equity-base)/base*100:0;const dUsd=dr.spot.equity+dr.futures.equity-base;
 const exp=Math.min(100,Math.max(0,st.exposure||0));const lossUsed=Math.max(dr.spot.loss_pct||0,dr.futures.loss_pct||0)/(dr.spot.limit_pct||9);const L=Math.PI*120,frac=Math.min(.99,Math.max(.04,1-lossUsed));
 const ang=Math.PI*(1-frac),cx=150+120*Math.cos(ang),cy=150-120*Math.sin(ang);
 const ev=EQ.map(p=>p.v);const fcum=[];let c=0;S.trades.filter(t=>isFut(t.symbol)).slice().reverse().forEach(t=>{c+=t.pnl_usdt||0;fcum.push(c)});
 const wr=[];let wn=0,tt=0;S.trades.slice().reverse().forEach(t=>{tt++;if(t.status==='WIN')wn++;wr.push(wn/tt*100)});
 const fwr=fu.closed?fu.wins/fu.closed*100:0;
 // hourly equity change bars
 const bk={};EQ.forEach(p=>{const h=new Date(p.t*1000).toLocaleTimeString('en-GB',{hour:'2-digit',timeZone:'Asia/Riyadh'});(bk[h]=bk[h]||[]).push(p.v)});
 const bars=Object.entries(bk).map(([h,v])=>[h,v[v.length-1]-v[0]]).slice(-10);const bm=Math.max(...bars.map(b=>Math.abs(b[1])),.01);
 const mk=S.markets.slice().sort((a,b)=>(b.signal_strength||0)-(a.signal_strength||0)).slice(0,27);
 const dot=m=>{const s=m.signal_strength||0;const a=.15+s/100*.85;return `<div title="${esc(m.symbol)} · ${f2(s,1)}" style="background:rgba(255,94,58,${a.toFixed(2)});${m.in_position?'box-shadow:0 0 0 3px #fff,0 0 0 5px #F2385A;':''}">${icoImg(m.symbol)||esc(baseSym(m.symbol).slice(0,4))}</div>`};
 const decs=S.decisions.slice(0,5);
 return `
 <div class="card c5 r2 gauge"><div class="ttl" style="width:100%"><span>إجمالي المحفظة (Spot + Futures)</span><span class="chip">${S.env==='demo'?'تجريبي':'حقيقي'}</span></div>
  <svg viewBox="0 0 300 175"><defs><linearGradient id="gg" x1="0" x2="1"><stop offset="0" stop-color="#FF9A4D"/><stop offset="1" stop-color="#F2385A"/></linearGradient></defs>
  <path d="M30 150A120 120 0 0 1 270 150" fill="none" stroke="#F1F2F4" stroke-width="20" stroke-linecap="round"/>
  <path class="arc" d="M30 150A120 120 0 0 1 270 150" fill="none" stroke="url(#gg)" stroke-width="20" stroke-linecap="round" stroke-dasharray="${L}" stroke-dashoffset="${L*(1-frac)}"/>
  <circle class="gdot" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="9" fill="#F2385A" stroke="#fff" stroke-width="4"/></svg>
  <div style="margin-top:-78px" class="big">${N('$'+f2(total))}</div>
