services:
  trading_bot:
    container_name: telegram_crypto_bot
    build: https://github.com/somily88/updeted.git#main
    ports:
      - "127.0.0.1:8010:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: always

  caddy:
    image: caddy:2-alpine
    command: ["caddy", "reverse-proxy", "--from", "sobhitrader.tech", "--to", "trading_bot:8000"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - trading_bot

volumes:
  caddy_data:
  caddy_config:
